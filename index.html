<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SH NOTES | دفتر ملاحظات شهد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <header class="header">
      <h1 class="logo">SH NOTES</h1>
      <p class="welcome">مساحة صغيرة لأفكارك</p>
      <div class="stats">عدد الملاحظات: <span id="notesCount">0</span></div>
    </header>

    <section class="toolbar">
      <input type="search" id="searchInput" class="input search" placeholder="ابحثي في ملاحظاتك...">
      <button id="addBtn" class="btn btn-primary">+ إضافة ملاحظة</button>
    </section>

    <main id="notesList" class="notes-grid"></main>

    <div id="emptyState" class="empty-state hidden">دفترك ما زال فارغًا، ابدئي بكتابة أول فكرة</div>
    <div id="noResults" class="empty-state hidden">لا توجد نتائج مطابقة للبحث</div>
  </div>

  <!-- نافذة إضافة / تعديل الملاحظة -->
  <div id="editorModal" class="modal hidden">
    <div class="modal-box">
      <h2 id="editorTitle">ملاحظة جديدة</h2>
      <input type="text" id="noteTitle" class="input" placeholder="عنوان الملاحظة">
      <textarea id="noteContent" class="input textarea" placeholder="اكتبي ملاحظتك هنا..."></textarea>
      <p id="noteMeta" class="meta"></p>
      <div class="modal-actions">
        <button id="deleteBtn" class="btn btn-danger hidden">حذف</button>
        <span class="spacer"></span>
        <button id="cancelBtn" class="btn btn-ghost">إلغاء</button>
        <button id="saveBtn" class="btn btn-primary">حفظ</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
